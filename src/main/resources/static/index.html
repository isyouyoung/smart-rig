<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartRig Inventory</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <script src="/js/jquery-3.6.0.min.js"></script>

    <link rel="stylesheet" href="/css/main.css">

</head>
<body class="main-page">

<main class="main-wrap">

    <header class="main-header">
        <h1>SmartRig Inventory</h1>
        <p id="tokenTime" class="token-time"></p>
    </header>

    <nav class="main-nav">
        <button id="btnHome" type="button">메인 화면</button>
        <button id="btnBuildPc" type="button">PC 제작</button>
        <button id="btnSalePc" type="button">판매 PC</button>
    </nav>

    <!-- 테스트용 재고 조회 -->
    <section class="lookup">
        <h2>재고 빠른 조회</h2>
        <div class="lookup-row">
            <label for="modelId">Model ID</label>
            <input type="number" id="modelId">
            <button id="btnSearchStock" type="button">조회</button>
        </div>
        <p id="stockModel"></p>
        <p id="stockQuantity"></p>
    </section>

    <section>
        <h2>Dashboard</h2>
        <div class="dash-grid">
            <div class="dash-card">
                <span class="dash-label">제작 가능 PC</span>
                <span class="dash-value">준비중</span>
            </div>
            <div class="dash-card">
                <span class="dash-label">추천 조립 사양</span>
                <span class="dash-value">준비중</span>
            </div>
            <div class="dash-card">
                <span class="dash-label">최근 입출고</span>
                <span class="dash-value">준비중</span>
            </div>
        </div>
    </section>

    <section>
        <h2>부품 목록</h2>
        <div class="part-grid">
            <button id="btnCpu" type="button" class="part-btn">CPU</button>
            <button id="btnMainBoard" type="button" class="part-btn">MainBoard</button>
            <button id="btnRam" type="button" class="part-btn soon">RAM</button>
            <button id="btnSsd" type="button" class="part-btn soon">SSD</button>
            <button id="btnHdd" type="button" class="part-btn soon">HDD</button>
            <button id="btnVga" type="button" class="part-btn soon">VGA</button>
            <button id="btnPower" type="button" class="part-btn soon">Power</button>
            <button id="btnCase" type="button" class="part-btn soon">Case</button>
            <button id="btnMonitor" type="button" class="part-btn soon">Monitor</button>
            <button id="btnKeyboard" type="button" class="part-btn soon">Keyboard</button>
            <button id="btnMouse" type="button" class="part-btn soon">Mouse</button>
            <button id="btnSpeaker" type="button" class="part-btn soon">Speaker</button>
        </div>
    </section>

</main>

<script src="/js/index.js"></script>

</body>
</html>
